pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: '*.{ts,vue,css,json,md,yaml}'
      run: pnpm fmt {staged_files}
      stage_fixed: true

    - name: lint
      glob: '*.{ts,vue}'
      run: pnpm lint {staged_files}

pre-push:
  parallel: true
  jobs:
    - name: check
      run: pnpm check

    - name: typecheck
      run: pnpm typecheck
